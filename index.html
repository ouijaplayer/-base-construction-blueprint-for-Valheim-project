<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valheim Base Planner</title>
  <style>
    :root {
      --bg: #12110e;
      --bg-raised: #1c1a16;
      --card: #27241f;
      --card-edge: #3f382e;
      --forest: #1a3328;
      --forest-line: #2f6b4f;
      --ink: #f4efe6;
      --muted: #b3a696;
      --amber: #f59e0b;
      --amber-deep: #b45309;
      --danger: #c46a3a;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(47, 107, 79, 0.28), transparent 55%),
        radial-gradient(900px 420px at 100% 0%, rgba(180, 83, 9, 0.16), transparent 50%),
        var(--bg);
    }

    header, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--amber);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 2vw, 2.2rem); letter-spacing: -0.03em; }
    h2, h3 { margin: 0; font-size: 0.95rem; }
    .lede { margin: 8px 0 0; max-width: 46rem; color: var(--muted); line-height: 1.45; }

    main {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 270px;
      gap: 18px;
      align-items: start;
      padding-bottom: 36px;
    }

    .panel {
      background: linear-gradient(180deg, #2a261f, var(--card));
      border: 1px solid var(--card-edge);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .materials { position: sticky; top: 16px; }

    .panel h2 {
      margin-bottom: 12px;
      color: #efe4d2;
    }

    #tool-list, .totals, .breakdown {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tool, .reset {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #4a4034;
      background: #1a1814;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .tool {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 4px 10px;
      padding: 10px 12px;
    }

    .tool strong { font-size: 0.92rem; }
    .tool span { grid-column: 2; color: var(--muted); font-size: 0.78rem; }
    .swatch {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .tool[aria-pressed="true"] {
      border-color: var(--amber);
      background: #3a2a12;
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.45);
    }

    .tool:focus-visible, .reset:focus-visible, .cell:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .stage {
      background:
        linear-gradient(180deg, rgba(26, 51, 40, 0.55), rgba(18, 17, 14, 0.2)),
        var(--bg-raised);
      border: 1px solid #314237;
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .stage-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    #active-label { color: var(--ink); font-weight: 650; }

    #grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 3px;
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 10px;
      aspect-ratio: 1;
      border-radius: 14px;
      background:
        repeating-linear-gradient(90deg, rgba(92, 64, 36, 0.18) 0 12px, rgba(62, 42, 24, 0.18) 12px 24px),
        #241c14;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }

    .cell {
      border: 0;
      border-radius: 3px;
      padding: 0;
      background: #171512;
      box-shadow: inset 0 0 0 1px rgba(255, 244, 220, 0.05);
    }

    .piece-floor {
      background: repeating-linear-gradient(90deg, #7a4e28 0 18%, #8d5c30 18% 22%, #684220 22% 100%);
    }

    .piece-wall {
      background: repeating-linear-gradient(180deg, #4a2a16 0 22%, #6b3d20 22% 28%, #3a2010 28% 100%);
      box-shadow: inset 0 0 0 2px #2a160c;
    }

    .piece-pillar {
      background:
        radial-gradient(circle at 50% 46%, #8fd0a8 0 18%, #1f7a48 19% 42%, #0e3d26 43% 68%, transparent 69%),
        #163528;
    }

    .piece-stone {
      background:
        linear-gradient(#3e4750, #3e4750) center / 100% 1px no-repeat,
        linear-gradient(#3e4750, #3e4750) center / 1px 100% no-repeat,
        repeating-linear-gradient(#7b8794, #7b8794 7px, #636e7a 7px 8px);
    }

    .piece-hearth {
      background: radial-gradient(circle at 50% 58%, #ffe7a3 0 14%, #f59e0b 18% 32%, #c2410c 36% 52%, #3b1a0c 56% 100%);
    }

    .swatch-eraser { background: repeating-linear-gradient(135deg, #3a342c 0 4px, #171512 4px 8px); }
    .swatch-floor { background: #8d5c30; }
    .swatch-wall { background: #6b3d20; }
    .swatch-pillar { background: #1f7a48; }
    .swatch-stone { background: #7b8794; }
    .swatch-hearth { background: radial-gradient(circle, #ffe7a3, #c2410c 70%); }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--forest);
      border: 1px solid rgba(47, 107, 79, 0.7);
    }

    .total b {
      font-size: 1.45rem;
      font-variant-numeric: tabular-nums;
      color: var(--amber);
    }

    .materials h3 {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .breakdown li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .breakdown b { color: var(--ink); font-variant-numeric: tabular-nums; }

    .reset {
      width: auto;
      padding: 10px 14px;
      background: #3a2218;
      border-color: var(--danger);
      color: #ffd7c2;
      font-weight: 700;
    }

    .reset:hover, .tool:hover { filter: brightness(1.08); }

    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .materials { position: static; }
      #grid { width: min(100%, 640px); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Base construction blueprint</p>
      <h1>Valheim Base Planner</h1>
      <p class="lede">Paint a 12×12 building zone. Click or drag to place pieces. Wood, Core Wood, and Stone update from whatever is on the grid.</p>
    </div>
    <button id="reset" class="reset" type="button">Reset grid</button>
  </header>
  <main>
    <section class="panel" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Building tools</h2>
      <div id="tool-list" role="toolbar" aria-label="Building tools"></div>
    </section>
    <section class="stage" aria-labelledby="grid-heading">
      <div class="stage-bar">
        <h2 id="grid-heading" class="visually-hidden">Building zone</h2>
        <span id="active-label"></span>
        <span id="fill-count"></span>
      </div>
      <div id="grid" role="grid" aria-label="12 by 12 building zone"></div>
    </section>
    <aside class="panel materials" aria-live="polite">
      <h2>Material shopping list</h2>
      <ul class="totals">
        <li class="total"><span>Wood</span><b id="total-wood">0</b></li>
        <li class="total"><span>Core Wood</span><b id="total-coreWood">0</b></li>
        <li class="total"><span>Stone</span><b id="total-stone">0</b></li>
      </ul>
      <h3>Placed pieces</h3>
      <ul id="breakdown" class="breakdown"></ul>
    </aside>
  </main>
  <script>
    const GRID_SIZE = 12;
    const MATERIALS = [
      { key: "wood", label: "Wood" },
      { key: "coreWood", label: "Core Wood" },
      { key: "stone", label: "Stone" }
    ];

    const ERASER = {
      id: "eraser",
      name: "Clear",
      detail: "Eraser",
      costLabel: "Removes a piece",
      costs: {}
    };

    const PIECES = {
      floor: {
        id: "floor",
        name: "Wood Floor",
        detail: "2×2m",
        costLabel: "2 Wood",
        costs: { wood: 2 }
      },
      wall: {
        id: "wall",
        name: "Wood Wall",
        detail: "2×2m",
        costLabel: "2 Wood",
        costs: { wood: 2 }
      },
      pillar: {
        id: "pillar",
        name: "Core Wood Pillar",
        detail: "4m",
        costLabel: "2 Core Wood",
        costs: { coreWood: 2 }
      },
      stone: {
        id: "stone",
        name: "Stone Wall",
        detail: "2×1m",
        costLabel: "4 Stone",
        costs: { stone: 4 }
      },
      hearth: {
        id: "hearth",
        name: "Hearth / Campfire",
        detail: "Fire",
        costLabel: "5 Stone + 2 Wood",
        costs: { stone: 5, wood: 2 }
      }
    };

    const TOOLS = [ERASER, ...Object.values(PIECES)];
    const grid = Array.from({ length: GRID_SIZE * GRID_SIZE }, () => null);
    let activeTool = "floor";
    let painting = false;

    const toolList = document.querySelector("#tool-list");
    const gridEl = document.querySelector("#grid");
    const activeLabel = document.querySelector("#active-label");
    const fillCount = document.querySelector("#fill-count");
    const breakdown = document.querySelector("#breakdown");
    const totalNodes = Object.fromEntries(
      MATERIALS.map((material) => [material.key, document.querySelector("#total-" + material.key)])
    );

    function paintCell(index) {
      const next = activeTool === "eraser" ? null : activeTool;
      if (grid[index] === next) return;
      grid[index] = next;
      const cell = gridEl.children[index];
      cell.className = "cell" + (next ? " piece-" + next : "");
      cell.setAttribute("aria-label", next ? PIECES[next].name : "Empty tile");
      updateTotals();
    }

    function cellFromPoint(event) {
      const target = document.elementFromPoint(event.clientX, event.clientY);
      const cell = target && target.closest ? target.closest(".cell") : null;
      if (!cell || !gridEl.contains(cell)) return null;
      return cell;
    }

    function updateTotals() {
      const totals = { wood: 0, coreWood: 0, stone: 0 };
      const counts = Object.fromEntries(Object.keys(PIECES).map((id) => [id, 0]));
      let filled = 0;

      grid.forEach((pieceId) => {
        if (!pieceId) return;
        filled += 1;
        counts[pieceId] += 1;
        const costs = PIECES[pieceId].costs;
        Object.keys(costs).forEach((key) => {
          totals[key] += costs[key];
        });
      });

      MATERIALS.forEach((material) => {
        totalNodes[material.key].textContent = String(totals[material.key]);
      });

      breakdown.replaceChildren();
      Object.values(PIECES).forEach((piece) => {
        const item = document.createElement("li");
        const name = document.createElement("span");
        const count = document.createElement("b");
        name.textContent = piece.name;
        count.textContent = String(counts[piece.id]);
        item.append(name, count);
        breakdown.append(item);
      });

      const tool = TOOLS.find((entry) => entry.id === activeTool);
      activeLabel.textContent = tool.name + (tool.detail ? " · " + tool.detail : "");
      fillCount.textContent = filled + " / " + grid.length + " tiles";
    }

    function selectTool(id) {
      activeTool = id;
      toolList.querySelectorAll(".tool").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.tool === id));
      });
      updateTotals();
    }

    function resetGrid() {
      grid.fill(null);
      Array.from(gridEl.children).forEach((cell) => {
        cell.className = "cell";
        cell.setAttribute("aria-label", "Empty tile");
      });
      updateTotals();
    }

    TOOLS.forEach((tool) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tool";
      button.dataset.tool = tool.id;
      button.setAttribute("aria-pressed", String(tool.id === activeTool));

      const swatch = document.createElement("span");
      swatch.className = "swatch swatch-" + tool.id;
      swatch.setAttribute("aria-hidden", "true");

      const name = document.createElement("strong");
      name.textContent = tool.name;

      const detail = document.createElement("span");
      detail.textContent = tool.detail + " · " + tool.costLabel;

      button.append(swatch, name, detail);
      button.addEventListener("click", () => selectTool(tool.id));
      toolList.append(button);
    });

    for (let index = 0; index < grid.length; index += 1) {
      const cell = document.createElement("div");
      const row = Math.floor(index / GRID_SIZE) + 1;
      const column = (index % GRID_SIZE) + 1;
      cell.className = "cell";
      cell.dataset.index = String(index);
      cell.setAttribute("role", "gridcell");
      cell.setAttribute("aria-label", "Empty tile, row " + row + ", column " + column);
      gridEl.append(cell);
    }

    gridEl.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      const cell = event.target.closest(".cell");
      if (!cell) return;
      painting = true;
      paintCell(Number(cell.dataset.index));
      event.preventDefault();
    });

    window.addEventListener("pointermove", (event) => {
      if (!painting) return;
      const cell = cellFromPoint(event);
      if (!cell) return;
      paintCell(Number(cell.dataset.index));
    });

    window.addEventListener("pointerup", () => { painting = false; });
    window.addEventListener("pointercancel", () => { painting = false; });
    document.querySelector("#reset").addEventListener("click", resetGrid);

    const visuallyHidden = document.createElement("style");
    visuallyHidden.textContent = ".visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}";
    document.head.append(visuallyHidden);

    updateTotals();
  </script>
</body>
</html>
